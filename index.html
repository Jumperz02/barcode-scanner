<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Barcode Scanner</title>
    <script src="https://unpkg.com/@AceCentre/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #16213e;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        header h1 { font-size: 1.2rem; font-weight: 600; }

        .badge {
            background: #0f3460;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .scanner-section {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: #000;
            overflow: hidden;
        }

        #reader {
            width: 100%;
        }

        #reader video {
            width: 100% !important;
        }

        .controls {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            justify-content: center;
            background: #16213e;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.95); }
        .btn-primary { background: #e94560; color: #fff; }
        .btn-secondary { background: #0f3460; color: #fff; }
        .btn-danger { background: #c0392b; color: #fff; }
        .btn-success { background: #27ae60; color: #fff; }
        .btn-blue { background: #2980b9; color: #fff; }

        .select-box {
            margin: 12px 16px;
            padding: 16px;
            background: #16213e;
            border-radius: 10px;
            border: 2px solid #f39c12;
            display: none;
        }

        .select-box.visible { display: block; }

        .select-box h3 {
            font-size: 1rem;
            margin-bottom: 12px;
        }

        .select-box .radio-list {
            list-style: none;
        }

        .select-box .radio-list li {
            padding: 12px;
            margin-bottom: 8px;
            background: #1a1a2e;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .select-box .radio-list li.selected {
            border-color: #e94560;
            background: #0f3460;
        }

        .select-box .radio-list li .radio-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #888;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .select-box .radio-list li.selected .radio-dot {
            border-color: #e94560;
        }

        .select-box .radio-list li.selected .radio-dot::after {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e94560;
        }

        .select-box .radio-list li .barcode-text {
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            word-break: break-all;
        }

        .select-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .select-actions button {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
        }

        .status-msg {
            text-align: center;
            padding: 8px;
            font-size: 0.8rem;
            color: #888;
        }

        .last-scan {
            background: #16213e;
            margin: 10px 16px;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #27ae60;
            display: none;
        }

        .last-scan.visible { display: block; }
        .last-scan .label { font-size: 0.7rem; text-transform: uppercase; color: #888; margin-bottom: 4px; }
        .last-scan .value { font-size: 1.1rem; font-family: 'Courier New', monospace; word-break: break-all; }
        .last-scan .format { font-size: 0.75rem; color: #e94560; margin-top: 4px; }

        .scan-list-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 16px 16px;
            overflow: hidden;
        }

        .scan-list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
        }

        .scan-list-header h2 { font-size: 1rem; }

        .scan-list {
            flex: 1;
            overflow-y: auto;
            border-radius: 8px;
            background: #16213e;
            max-height: 250px;
        }

        .scan-item {
            padding: 12px;
            border-bottom: 1px solid #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .scan-item:last-child { border-bottom: none; }
        .scan-item .info { flex: 1; min-width: 0; }
        .scan-item .barcode-value { font-family: 'Courier New', monospace; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .scan-item .meta { font-size: 0.7rem; color: #888; margin-top: 2px; }
        .scan-item .delete-btn { background: none; border: none; color: #e94560; font-size: 1.2rem; padding: 4px 8px; cursor: pointer; }

        .empty-state { text-align: center; padding: 40px 20px; color: #555; }
        .empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }

        .export-bar {
            padding: 12px 16px;
            background: #16213e;
            display: flex;
            gap: 10px;
        }

        .export-bar button { flex: 1; }

        .manual-input {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            background: #16213e;
        }

        .manual-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #0f3460;
            border-radius: 8px;
            background: #1a1a2e;
            color: #eee;
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
        }

        .manual-input input::placeholder { color: #555; }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #27ae60;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }

        .toast.show { opacity: 1; }
        .version { text-align: center; font-size: 0.6rem; color: #444; padding: 2px; }
    </style>
</head>
<body>
    <header>
        <h1>&#128225; Barcode Scanner</h1>
        <span class="badge" id="countBadge">0 scans</span>
    </header>

    <div class="scanner-section">
        <div id="reader"></div>
    </div>

    <div class="status-msg" id="statusMsg">Tap "Start Camera" to begin</div>
    <div class="version">v6.0</div>

    <div class="controls">
        <button class="btn-primary" id="startBtn" onclick="startScanner()">Start Camera</button>
        <button class="btn-secondary" id="stopBtn" onclick="stopScanner()" style="display:none;">Stop</button>
    </div>

    <div class="select-box" id="selectBox">
        <h3>Select a Barcode</h3>
        <ul class="radio-list" id="radioList"></ul>
        <div class="select-actions">
            <button class="btn-primary" onclick="selectBarcode()">Select Barcode</button>
            <button class="btn-blue" onclick="scanAgain()">Scan Again</button>
        </div>
    </div>

    <div class="last-scan" id="lastScan">
        <div class="label">Last Added</div>
        <div class="value" id="lastValue"></div>
        <div class="format" id="lastFormat"></div>
    </div>

    <div class="manual-input">
        <input type="text" id="manualInput" placeholder="Or type barcode manually...">
        <button class="btn-success" onclick="addManual()">Add</button>
    </div>

    <div class="scan-list-section">
        <div class="scan-list-header">
            <h2>Recorded Barcodes</h2>
            <button class="btn-danger" onclick="clearAll()" style="padding:6px 12px;font-size:0.75rem;">Clear All</button>
        </div>
        <div class="scan-list" id="scanList">
            <div class="empty-state"><div class="icon">&#128247;</div><div>No barcodes recorded yet.</div></div>
        </div>
    </div>

    <div class="export-bar">
        <button class="btn-secondary" onclick="exportCSV()">&#128196; Export CSV</button>
        <button class="btn-secondary" onclick="copyAll()">&#128203; Copy All</button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        var scans = JSON.parse(localStorage.getItem('barcode_scans') || '[]');
        var html5QrCode = null;
        var isScanning = false;
        var detectedCodes = [];
        var selectedIndex = -1;
        var collectMode = true;
        var collectTimeout = null;

        renderList();
        updateBadge();

        function startScanner() {
            document.getElementById('statusMsg').textContent = 'Starting camera...';
            document.getElementById('selectBox').classList.remove('visible');
            detectedCodes = [];
            selectedIndex = -1;
            collectMode = true;

            html5QrCode = new Html5Qrcode("reader");

            var config = {
                fps: 10,
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    var minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                    var size = Math.floor(minEdge * 0.8);
                    return { width: size, height: Math.floor(size * 0.6) };
                },
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.CODE_128,
                    Html5QrcodeSupportedFormats.CODE_39,
                    Html5QrcodeSupportedFormats.CODE_93,
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.UPC_E,
                    Html5QrcodeSupportedFormats.ITF,
                    Html5QrcodeSupportedFormats.CODABAR
                ]
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                function(decodedText, decodedResult) {
                    if (!collectMode) return;
                    onBarcodeDetected(decodedText, decodedResult);
                },
                function(errorMessage) {
                    // scan error, ignore
                }
            ).then(function() {
                isScanning = true;
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('stopBtn').style.display = 'inline-block';
                document.getElementById('statusMsg').textContent = 'Scanning... hold steady over barcodes';
                startCollectTimer();
            }).catch(function(err) {
                document.getElementById('statusMsg').textContent = 'Camera error: ' + err;
            });
        }

        function startCollectTimer() {
            // Collect barcodes for 3 seconds, then show selection
            if (collectTimeout) clearTimeout(collectTimeout);
            collectTimeout = setTimeout(function() {
                if (detectedCodes.length > 0) {
                    showSelection();
                } else {
                    // Keep trying
                    startCollectTimer();
                }
            }, 3000);
        }

        function onBarcodeDetected(text, result) {
            // Add to detected list if not already there
            var exists = detectedCodes.find(function(c) { return c.text === text; });
            if (!exists) {
                var format = result.result.format ? result.result.format.formatName : 'UNKNOWN';
                detectedCodes.push({ text: text, format: format });
                if (navigator.vibrate) navigator.vibrate(50);

                // Reset timer — give more time to find additional barcodes
                if (collectTimeout) clearTimeout(collectTimeout);
                collectTimeout = setTimeout(function() {
                    showSelection();
                }, 2000);
            }
        }

        function showSelection() {
            collectMode = false;

            // If only one barcode found, auto-add it
            if (detectedCodes.length === 1) {
                addScan(detectedCodes[0].text, detectedCodes[0].format);
                detectedCodes = [];
                collectMode = true;
                startCollectTimer();
                return;
            }

            // Multiple barcodes — show selection UI
            selectedIndex = 0;
            renderRadioList();
            document.getElementById('selectBox').classList.add('visible');
            document.getElementById('statusMsg').textContent = 'Multiple barcodes found — select one:';
        }

        function renderRadioList() {
            var list = document.getElementById('radioList');
            list.innerHTML = detectedCodes.map(function(c, idx) {
                var sel = idx === selectedIndex ? ' selected' : '';
                return '<li class="' + sel + '" onclick="pickRadio(' + idx + ')">' +
                    '<div class="radio-dot"></div>' +
                    '<span class="barcode-text">' + escapeHtml(c.text) + '</span></li>';
            }).join('');
        }

        function pickRadio(idx) {
            selectedIndex = idx;
            renderRadioList();
        }

        function selectBarcode() {
            if (selectedIndex < 0 || selectedIndex >= detectedCodes.length) return;
            var chosen = detectedCodes[selectedIndex];
            addScan(chosen.text, chosen.format);
            document.getElementById('selectBox').classList.remove('visible');
            detectedCodes = [];
            collectMode = true;
            startCollectTimer();
            document.getElementById('statusMsg').textContent = 'Added! Scanning for more...';
        }

        function scanAgain() {
            document.getElementById('selectBox').classList.remove('visible');
            detectedCodes = [];
            selectedIndex = -1;
            collectMode = true;
            startCollectTimer();
            document.getElementById('statusMsg').textContent = 'Scanning again... hold steady';
        }

        function stopScanner() {
            if (collectTimeout) clearTimeout(collectTimeout);
            collectMode = false;
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(function() {
                    isScanning = false;
                    document.getElementById('startBtn').style.display = 'inline-block';
                    document.getElementById('stopBtn').style.display = 'none';
                    document.getElementById('statusMsg').textContent = 'Scanner stopped';
                });
            }
        }

        function addScan(value, format) {
            var now = Date.now();
            var scan = {
                value: value,
                format: format || 'manual',
                timestamp: now,
                id: now + '_' + Math.random().toString(36).substr(2, 5)
            };
            scans.unshift(scan);
            save();
            renderList();
            updateBadge();
            showLastScan(scan);
            showToast('Added: ' + value);
            if (navigator.vibrate) navigator.vibrate(100);
        }

        function addManual() {
            var input = document.getElementById('manualInput');
            var val = input.value.trim();
            if (val) { addScan(val, 'manual'); input.value = ''; }
        }

        document.getElementById('manualInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') addManual();
        });

        function showLastScan(scan) {
            document.getElementById('lastScan').classList.add('visible');
            document.getElementById('lastValue').textContent = scan.value;
            document.getElementById('lastFormat').textContent = scan.format.toUpperCase();
        }

        function deleteScan(id) {
            scans = scans.filter(function(s) { return s.id !== id; });
            save(); renderList(); updateBadge();
        }

        function clearAll() {
            if (confirm('Clear all recorded barcodes?')) {
                scans = []; save(); renderList(); updateBadge();
                document.getElementById('lastScan').classList.remove('visible');
            }
        }

        function renderList() {
            var list = document.getElementById('scanList');
            if (scans.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="icon">&#128247;</div><div>No barcodes recorded yet.</div></div>';
                return;
            }
            list.innerHTML = scans.map(function(s) {
                return '<div class="scan-item"><div class="info"><div class="barcode-value">' + escapeHtml(s.value) + '</div><div class="meta">' + s.format.toUpperCase() + ' &bull; ' + formatTime(s.timestamp) + '</div></div><button class="delete-btn" onclick="deleteScan(\'' + s.id + '\')">&times;</button></div>';
            }).join('');
        }

        function exportCSV() {
            if (scans.length === 0) { showToast('Nothing to export'); return; }
            var csv = 'Barcode,Format,Timestamp\n';
            scans.forEach(function(s) { csv += '"' + s.value + '","' + s.format + '","' + new Date(s.timestamp).toISOString() + '"\n'; });
            var blob = new Blob([csv], { type: 'text/csv' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a'); a.href = url;
            a.download = 'barcodes_' + new Date().toISOString().slice(0,10) + '.csv';
            a.click(); URL.revokeObjectURL(url);
            showToast('CSV exported!');
        }

        function copyAll() {
            if (scans.length === 0) { showToast('Nothing to copy'); return; }
            var text = scans.map(function(s) { return s.value; }).join('\n');
            navigator.clipboard.writeText(text).then(function() { showToast('Copied ' + scans.length + ' barcodes!'); });
        }

        function save() { localStorage.setItem('barcode_scans', JSON.stringify(scans)); }

        function updateBadge() {
            document.getElementById('countBadge').textContent = scans.length + ' scan' + (scans.length !== 1 ? 's' : '');
        }

        function formatTime(ts) {
            var d = new Date(ts);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' ' + d.toLocaleDateString();
        }

        function escapeHtml(str) { var div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

        function showToast(msg) {
            var t = document.getElementById('toast'); t.textContent = msg;
            t.classList.add('show'); setTimeout(function() { t.classList.remove('show'); }, 2000);
        }
    </script>
</body>
</html>
