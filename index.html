<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Barcode Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #16213e;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        header h1 { font-size: 1.2rem; font-weight: 600; }

        .badge {
            background: #0f3460;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .scanner-section {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: #000;
            overflow: hidden;
        }

        #scanner-container {
            width: 100%;
            min-height: 250px;
            position: relative;
        }

        #scanner-container video {
            width: 100%;
            display: block;
        }

        #scanner-container canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        .scan-line {
            position: absolute;
            top: 50%;
            left: 5%;
            right: 5%;
            height: 3px;
            background: #e94560;
            box-shadow: 0 0 10px #e94560;
            transform: translateY(-50%);
            animation: scan 2s ease-in-out infinite;
            z-index: 10;
            pointer-events: none;
            display: none;
        }

        .scan-line.active { display: block; }

        @keyframes scan {
            0%, 100% { top: 30%; }
            50% { top: 70%; }
        }

        .controls {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            justify-content: center;
            background: #16213e;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.95); }
        .btn-primary { background: #e94560; color: #fff; }
        .btn-secondary { background: #0f3460; color: #fff; }
        .btn-danger { background: #c0392b; color: #fff; }
        .btn-success { background: #27ae60; color: #fff; }
        .btn-blue { background: #2980b9; color: #fff; }

        .select-box {
            margin: 12px 16px;
            padding: 16px;
            background: #16213e;
            border-radius: 10px;
            border: 2px solid #f39c12;
            display: none;
        }

        .select-box.visible { display: block; }

        .select-box h3 {
            font-size: 1rem;
            margin-bottom: 12px;
        }

        .radio-list {
            list-style: none;
        }

        .radio-list li {
            padding: 12px;
            margin-bottom: 8px;
            background: #1a1a2e;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .radio-list li.selected {
            border-color: #e94560;
            background: #0f3460;
        }

        .radio-list li .radio-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #888;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .radio-list li.selected .radio-dot {
            border-color: #e94560;
        }

        .radio-list li.selected .radio-dot::after {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e94560;
        }

        .radio-list li .barcode-text {
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            word-break: break-all;
        }

        .select-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .select-actions button {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
        }

        .found-count {
            text-align: center;
            padding: 6px;
            font-size: 0.8rem;
            color: #f39c12;
            display: none;
        }

        .found-count.visible { display: block; }

        .status-msg {
            text-align: center;
            padding: 8px;
            font-size: 0.8rem;
            color: #888;
        }

        .last-scan {
            background: #16213e;
            margin: 10px 16px;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #27ae60;
            display: none;
        }

        .last-scan.visible { display: block; }
        .last-scan .label { font-size: 0.7rem; text-transform: uppercase; color: #888; margin-bottom: 4px; }
        .last-scan .value { font-size: 1.1rem; font-family: 'Courier New', monospace; word-break: break-all; }
        .last-scan .format { font-size: 0.75rem; color: #e94560; margin-top: 4px; }

        .scan-list-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 16px 16px;
            overflow: hidden;
        }

        .scan-list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
        }

        .scan-list-header h2 { font-size: 1rem; }

        .scan-list {
            flex: 1;
            overflow-y: auto;
            border-radius: 8px;
            background: #16213e;
            max-height: 250px;
        }

        .scan-item {
            padding: 12px;
            border-bottom: 1px solid #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .scan-item:last-child { border-bottom: none; }
        .scan-item .info { flex: 1; min-width: 0; }
        .scan-item .barcode-value { font-family: 'Courier New', monospace; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .scan-item .meta { font-size: 0.7rem; color: #888; margin-top: 2px; }
        .scan-item .delete-btn { background: none; border: none; color: #e94560; font-size: 1.2rem; padding: 4px 8px; cursor: pointer; }

        .empty-state { text-align: center; padding: 40px 20px; color: #555; }
        .empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }

        .export-bar {
            padding: 12px 16px;
            background: #16213e;
            display: flex;
            gap: 10px;
        }

        .export-bar button { flex: 1; }

        .manual-input {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            background: #16213e;
        }

        .manual-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #0f3460;
            border-radius: 8px;
            background: #1a1a2e;
            color: #eee;
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
        }

        .manual-input input::placeholder { color: #555; }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #27ae60;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }

        .toast.show { opacity: 1; }
        .version { text-align: center; font-size: 0.6rem; color: #444; padding: 2px; }
    </style>
</head>
<body>
    <header>
        <h1>&#128225; Barcode Scanner</h1>
        <span class="badge" id="countBadge">0 scans</span>
    </header>

    <div class="scanner-section">
        <div id="scanner-container"></div>
        <div class="scan-line" id="scanLine"></div>
    </div>

    <div class="status-msg" id="statusMsg">Tap "Start Camera" to begin</div>
    <div class="found-count" id="foundCount"></div>
    <div class="version">v7.0</div>

    <div class="controls">
        <button class="btn-primary" id="startBtn" onclick="startScanner()">Start Camera</button>
        <button class="btn-secondary" id="stopBtn" onclick="stopScanner()" style="display:none;">Stop</button>
    </div>

    <div class="select-box" id="selectBox">
        <h3>Select a Barcode</h3>
        <ul class="radio-list" id="radioList"></ul>
        <div class="select-actions">
            <button class="btn-primary" onclick="selectBarcode()">Select Barcode</button>
            <button class="btn-blue" onclick="scanAgain()">Scan Again</button>
        </div>
    </div>

    <div class="last-scan" id="lastScan">
        <div class="label">Last Added</div>
        <div class="value" id="lastValue"></div>
        <div class="format" id="lastFormat"></div>
    </div>

    <div class="manual-input">
        <input type="text" id="manualInput" placeholder="Or type barcode manually...">
        <button class="btn-success" onclick="addManual()">Add</button>
    </div>

    <div class="scan-list-section">
        <div class="scan-list-header">
            <h2>Recorded Barcodes</h2>
            <button class="btn-danger" onclick="clearAll()" style="padding:6px 12px;font-size:0.75rem;">Clear All</button>
        </div>
        <div class="scan-list" id="scanList">
            <div class="empty-state"><div class="icon">&#128247;</div><div>No barcodes recorded yet.</div></div>
        </div>
    </div>

    <div class="export-bar">
        <button class="btn-secondary" onclick="exportCSV()">&#128196; Export CSV</button>
        <button class="btn-secondary" onclick="copyAll()">&#128203; Copy All</button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        var scans = JSON.parse(localStorage.getItem('barcode_scans') || '[]');
        var isScanning = false;
        var detectedCodes = [];
        var selectedIndex = 0;
        var collectTimer = null;
        var lastNewDetect = 0;

        renderList();
        updateBadge();

        function startScanner() {
            document.getElementById('statusMsg').textContent = 'Starting camera...';
            document.getElementById('selectBox').classList.remove('visible');
            document.getElementById('foundCount').classList.remove('visible');
            detectedCodes = [];

            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: document.querySelector('#scanner-container'),
                    constraints: {
                        facingMode: "environment",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                },
                decoder: {
                    readers: [
                        "code_128_reader",
                        "ean_reader",
                        "ean_8_reader",
                        "code_39_reader",
                        "code_39_vin_reader",
                        "codabar_reader",
                        "upc_reader",
                        "upc_e_reader",
                        "i2of5_reader",
                        "2of5_reader",
                        "code_93_reader"
                    ],
                    multiple: false
                },
                locate: true,
                frequency: 10
            }, function(err) {
                if (err) {
                    document.getElementById('statusMsg').textContent = 'Camera error: ' + err.message;
                    return;
                }
                Quagga.start();
                isScanning = true;
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('stopBtn').style.display = 'inline-block';
                document.getElementById('scanLine').classList.add('active');
                document.getElementById('statusMsg').textContent = 'Scanning... slowly sweep across barcodes';
                startCollecting();
            });

            Quagga.onDetected(function(result) {
                var code = result.codeResult.code;
                var format = result.codeResult.format;

                // Confidence check
                if (result.codeResult.decodedCodes) {
                    var validCodes = result.codeResult.decodedCodes.filter(function(c) {
                        return c.error !== undefined && c.error < 0.25;
                    });
                    if (validCodes.length < 3) return;
                }

                // Add if not already detected
                var exists = detectedCodes.find(function(c) { return c.code === code; });
                if (!exists) {
                    detectedCodes.push({ code: code, format: format });
                    lastNewDetect = Date.now();
                    if (navigator.vibrate) navigator.vibrate(50);
                    updateFoundCount();
                }
            });
        }

        function startCollecting() {
            // Check every second: if we have codes and haven't found a new one in 2 sec, show selection
            collectTimer = setInterval(function() {
                if (detectedCodes.length > 0) {
                    var timeSinceLast = Date.now() - lastNewDetect;
                    if (timeSinceLast > 2000) {
                        // Done collecting — show selection
                        clearInterval(collectTimer);
                        showSelection();
                    }
                }
            }, 500);
        }

        function updateFoundCount() {
            var el = document.getElementById('foundCount');
            el.textContent = 'Found ' + detectedCodes.length + ' barcode(s)... keep scanning or wait';
            el.classList.add('visible');
        }

        function showSelection() {
            document.getElementById('foundCount').classList.remove('visible');

            // If only 1 found, auto-add
            if (detectedCodes.length === 1) {
                addScan(detectedCodes[0].code, detectedCodes[0].format);
                document.getElementById('statusMsg').textContent = 'Added! Scanning for more...';
                detectedCodes = [];
                startCollecting();
                return;
            }

            // Multiple found — show radio selection
            Quagga.stop();
            isScanning = false;
            document.getElementById('scanLine').classList.remove('active');
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('startBtn').style.display = 'none';

            selectedIndex = 0;
            renderRadioList();
            document.getElementById('selectBox').classList.add('visible');
            document.getElementById('statusMsg').textContent = 'Select the barcode you want:';
        }

        function renderRadioList() {
            var list = document.getElementById('radioList');
            list.innerHTML = detectedCodes.map(function(c, idx) {
                var sel = idx === selectedIndex ? ' selected' : '';
                return '<li class="' + sel + '" onclick="pickRadio(' + idx + ')">' +
                    '<div class="radio-dot"></div>' +
                    '<span class="barcode-text">' + escapeHtml(c.code) + '</span></li>';
            }).join('');
        }

        function pickRadio(idx) {
            selectedIndex = idx;
            renderRadioList();
        }

        function selectBarcode() {
            if (selectedIndex < 0 || selectedIndex >= detectedCodes.length) return;
            var chosen = detectedCodes[selectedIndex];
            addScan(chosen.code, chosen.format);
            document.getElementById('selectBox').classList.remove('visible');
            document.getElementById('statusMsg').textContent = 'Added! Tap Start Camera to scan more.';
            document.getElementById('startBtn').style.display = 'inline-block';
            detectedCodes = [];
        }

        function scanAgain() {
            document.getElementById('selectBox').classList.remove('visible');
            detectedCodes = [];
            selectedIndex = 0;
            startScanner();
        }

        function stopScanner() {
            if (collectTimer) clearInterval(collectTimer);
            Quagga.stop();
            isScanning = false;
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('scanLine').classList.remove('active');
            document.getElementById('foundCount').classList.remove('visible');
            document.getElementById('statusMsg').textContent = 'Scanner stopped';

            // If we collected some, show selection anyway
            if (detectedCodes.length > 1) {
                showSelection();
            } else if (detectedCodes.length === 1) {
                addScan(detectedCodes[0].code, detectedCodes[0].format);
                detectedCodes = [];
            }
        }

        function addScan(value, format) {
            var now = Date.now();
            var scan = {
                value: value,
                format: format || 'manual',
                timestamp: now,
                id: now + '_' + Math.random().toString(36).substr(2, 5)
            };
            scans.unshift(scan);
            save();
            renderList();
            updateBadge();
            showLastScan(scan);
            showToast('Added: ' + value);
            if (navigator.vibrate) navigator.vibrate(100);
        }

        function addManual() {
            var input = document.getElementById('manualInput');
            var val = input.value.trim();
            if (val) { addScan(val, 'manual'); input.value = ''; }
        }

        document.getElementById('manualInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') addManual();
        });

        function showLastScan(scan) {
            document.getElementById('lastScan').classList.add('visible');
            document.getElementById('lastValue').textContent = scan.value;
            document.getElementById('lastFormat').textContent = scan.format.toUpperCase();
        }

        function deleteScan(id) {
            scans = scans.filter(function(s) { return s.id !== id; });
            save(); renderList(); updateBadge();
        }

        function clearAll() {
            if (confirm('Clear all recorded barcodes?')) {
                scans = []; save(); renderList(); updateBadge();
                document.getElementById('lastScan').classList.remove('visible');
            }
        }

        function renderList() {
            var list = document.getElementById('scanList');
            if (scans.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="icon">&#128247;</div><div>No barcodes recorded yet.</div></div>';
                return;
            }
            list.innerHTML = scans.map(function(s) {
                return '<div class="scan-item"><div class="info"><div class="barcode-value">' + escapeHtml(s.value) + '</div><div class="meta">' + s.format.toUpperCase() + ' &bull; ' + formatTime(s.timestamp) + '</div></div><button class="delete-btn" onclick="deleteScan(\'' + s.id + '\')">&times;</button></div>';
            }).join('');
        }

        function exportCSV() {
            if (scans.length === 0) { showToast('Nothing to export'); return; }
            var csv = 'Barcode,Format,Timestamp\n';
            scans.forEach(function(s) { csv += '"' + s.value + '","' + s.format + '","' + new Date(s.timestamp).toISOString() + '"\n'; });
            var blob = new Blob([csv], { type: 'text/csv' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a'); a.href = url;
            a.download = 'barcodes_' + new Date().toISOString().slice(0,10) + '.csv';
            a.click(); URL.revokeObjectURL(url);
            showToast('CSV exported!');
        }

        function copyAll() {
            if (scans.length === 0) { showToast('Nothing to copy'); return; }
            var text = scans.map(function(s) { return s.value; }).join('\n');
            navigator.clipboard.writeText(text).then(function() { showToast('Copied ' + scans.length + ' barcodes!'); });
        }

        function save() { localStorage.setItem('barcode_scans', JSON.stringify(scans)); }

        function updateBadge() {
            document.getElementById('countBadge').textContent = scans.length + ' scan' + (scans.length !== 1 ? 's' : '');
        }

        function formatTime(ts) {
            var d = new Date(ts);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' ' + d.toLocaleDateString();
        }

        function escapeHtml(str) { var div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

        function showToast(msg) {
            var t = document.getElementById('toast'); t.textContent = msg;
            t.classList.add('show'); setTimeout(function() { t.classList.remove('show'); }, 2000);
        }
    </script>
</body>
</html>
